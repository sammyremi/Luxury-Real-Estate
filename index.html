<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Real Estate | Sophisticated Living</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Discover premium, sophisticated, and cinematic luxury real estate properties.">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero-section">
        <!-- Background Video -->
        <div class="video-container">
            <video 
                class="hero-video"
                autoplay 
                muted 
                loop
                playsinline
                poster="property-fallback.png"
            >
                <source src="mansion_video/Luxury_mansion_exterior_boomerang.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <!-- Gradient Overlay -->
            <div class="video-overlay"></div>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="fade-in-up">Elegance Redefined</h1>
            <p class="fade-in-up delay-1">Discover the most exclusive luxury villas and estates around the globe.</p>
            <div class="hero-actions fade-in-up delay-2">
                <a href="#properties" class="btn btn-primary">Explore Properties</a>
            </div>
        </div>
    </header>
</body>
</html>
